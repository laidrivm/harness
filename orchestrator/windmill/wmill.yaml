defaultTs: bun
# Only the pass's own folder: a push deletes whatever the scope holds that this
# tree does not, and the workspace's built-ins and the hand-made variables live
# only in the engine.
includes:
  - f/orchestrator/**
excludes: []
codebases: []
skipVariables: true
skipResources: true
skipResourceTypes: true
# Workspace-level, so the includes above do not scope them.
skipWorkspaceDependencies: true
skipDatatableMigrations: true
skipSecrets: true
includeSchedules: true
includeTriggers: true
