# CodeRabbit config for the harness. It points the review bot at the rulebook
# and the docs beside it, turns on the bot's approval and keeps it reviewing,
# and has it read a change's artefacts for contradictions rather than wording.
# bun/review-config.test.ts pins each, and openspec/specs/local-review-loop
# holds the contract.
reviews:
  path_instructions:
    # Filtering the path out instead would lose the contradictions there too,
    # and leave a proposal pull request nothing to review.
    - path: "openspec/changes/**"
      instructions: >-
        A working artefact of an OpenSpec change, headed for the archive.
        Flag contradictions with a spec, the code or another artefact.
        Do not flag wording, duplication or style.
  auto_approvals:
    # The bot's approval is the one the main ruleset requires: it comes only
    # on a reviewed head with every required thread resolved.
    enabled: true
  auto_review:
    # The default pauses after five reviewed pushes, and a paused bot neither
    # reviews nor approves the head an agent identity needs approved.
    auto_pause_after_reviewed_commits: 0
knowledge_base:
  code_guidelines:
    # Added on top of CodeRabbit's defaults, which already read **/CLAUDE.md,
    # so that file is deliberately not named again.
    # Flat on purpose: "core/*.md" leaves out core/skills/**, which are
    # prompts for an agent rather than rules a reviewer should quote.
    filePatterns:
      - "core/*.md"
