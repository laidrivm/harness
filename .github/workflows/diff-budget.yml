name: Diff budget

on:
  # `edited` alongside the defaults, because the override this gate honours
  # lives in the pull request body: without it a marker added after the last
  # push is never read.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      # `<base>...HEAD` needs the merge base, which a shallow clone does not
      # carry; the script fails rather than passing when it cannot measure.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The script reads its exclusions from package.json with bun. No install:
      # the script needs none of the package's dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The base is the checked-out merge commit's first parent, not
      # `pull_request.base.sha`. The checkout is `refs/pull/<n>/merge`, the head
      # merged into the base branch's current tip, while `base.sha` stays put
      # when the base branch advances — so measured from it, every commit landed
      # on the base since would count as this branch's. A checkout with no
      # second parent is not that merge commit, and its first parent would
      # measure one commit, so the check fails instead.
      # The body is not interpolated into the script text: it is
      # attacker-controlled, so it reaches the shell through the environment.
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git rev-parse --verify --quiet 'HEAD^2' >/dev/null || {
            echo "DIFF gate: ERROR — HEAD is not the pull request's merge commit" >&2
            exit 2
          }
          bash bun/diff-budget.sh 'HEAD^1'
